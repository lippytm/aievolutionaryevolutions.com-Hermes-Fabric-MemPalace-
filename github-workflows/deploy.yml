name: Disabled Legacy Jarvis Deployment Template

# Kept outside .github/workflows/ intentionally. This repository has no Node app
# at its root. Do not activate this stub as a deployment pipeline.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse deployment from a documentation-only checkout
        run: |
          echo "::error::No deployable root Node application exists here. Read docs/EXISTING_CONNECTION_RECOVERY.md and identify the existing authoritative runtime."
          exit 1
